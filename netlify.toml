[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[edge_functions]]
  path = "/api/sync"
  function = "sync"

[[edge_functions]]
  path = "/api/photo"
  function = "photo"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback for client-side routing (the app is single-page)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
