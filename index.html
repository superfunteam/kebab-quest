<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Kebab Quest — One Kebab a Day or Die Trying</title>
  <meta name="description" content="One pod, many kebabs. A retro 16-bit kebab tracker for the trip — tap to log, keep your streak, beat the pod." />

  <!-- PWA / add to home screen -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f380f" />
  <meta name="application-name" content="Kebab Quest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kebab Quest" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="canonical" href="https://kebab.quest/" />

  <!-- Open Graph (link unfurls in iMessage, Slack, Discord, Facebook, WhatsApp…) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kebab Quest" />
  <meta property="og:url" content="https://kebab.quest/" />
  <meta property="og:title" content="Kebab Quest — One Kebab a Day or Die Trying" />
  <meta property="og:description" content="One pod, many kebabs. A retro 16-bit kebab tracker for the trip — tap to log, keep your streak, beat the pod." />
  <meta property="og:image" content="https://kebab.quest/unfurl.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="675" />
  <meta property="og:image:alt" content="Kebab Quest — a pixel-art hero hoisting a kebab over a green 8-bit landscape" />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kebab Quest — One Kebab a Day or Die Trying" />
  <meta name="twitter:description" content="One pod, many kebabs. A retro 16-bit kebab tracker for the trip." />
  <meta name="twitter:image" content="https://kebab.quest/unfurl.png" />
  <meta name="twitter:image:alt" content="Kebab Quest — a pixel-art hero hoisting a kebab over a green 8-bit landscape" />

  <!-- self-hosted fonts — preloaded so first paint has them, no external request -->
  <link rel="preload" href="/fonts/vt323.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin />
</head>
